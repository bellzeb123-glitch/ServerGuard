name: Build ServerGuard

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5


      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven


      - name: Install bell-hub-api
        run: |
          git clone --depth 1 https://github.com/bellzeb123-glitch/bell-hub-api.git /tmp/bell-hub-api
          mvn -f /tmp/bell-hub-api/pom.xml install -DskipTests -B -q

      - name: Kompiluj
        run: mvn clean package -q

      - name: Zapisz JAR
        uses: actions/upload-artifact@v4
        with:
          name: ServerGuard
          path: target/ServerGuardV2-*.jar
          retention-days: 30
