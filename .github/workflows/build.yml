name: Build ServerGuard

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Clone BellLands (bell-hub-api source)
        run: git clone --depth 1 https://github.com/bellzeb123-glitch/BellLands.git BellLands

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install bell-hub-api
        run: mvn -B -f BellLands/bell-suite-api/pom.xml clean install

      - name: Kompiluj
        run: mvn clean package -q

      - name: Zapisz JAR
        uses: actions/upload-artifact@v4
        with:
          name: ServerGuard
          path: target/ServerGuardV2-*.jar
          retention-days: 30
