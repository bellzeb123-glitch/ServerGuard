name: ServerGuard
version: 1.26.2.0
main: pl.serverguard.ServerGuard
api-version: '26.2'
description: "Monitoring serwera - komendy, skrzynie, bloki, panel GUI."
authors: [ServerGuard]

softdepend:
  - BellHub
  - BellLands

commands:
  sg:
    description: Panel administracyjny ServerGuard
    usage: /sg [gui|reload|help|invsee]
  sghistory:
    description: Historia gracza
    usage: /sghistory <nick> [komendy|skrzynie|bloki|encje] [ilosc]
    permission: serverguard.admin
  sgsearch:
    description: Szukaj w logach
    usage: /sgsearch <fraza>
    permission: serverguard.admin

permissions:
  serverguard.admin:
    description: Dostep do komend ServerGuard
    default: op
    children:
      serverguard.invsee: true
  serverguard.invsee:
    description: Podglad ekwipunku gracza na zywo (/sg invsee)
    default: op
  serverguard.invsee.edit:
    description: Edycja ekwipunku / enderchest przez invsee
    default: op
  serverguard.notify:
    description: Otrzymuje alerty o probach uzycia komend admina
    default: op
  serverguard.bypass:
    description: Pomija logowanie komend gracza
    default: false
  serverguard.audit.bypass:
    description: Pomija audyt i blokade komend admina
    default: false
  serverguard.gamemode.bypass:
    description: Pomija ograniczenia trybow (np. blokade creative)
    default: op
