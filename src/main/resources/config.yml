    # --- BellLands ---
    - pattern: claim admin
      permission: belllands.admin
      block: true
    - pattern: belllands language
      permission: belllands.admin
      block: true
    - pattern: region
      permission: belllandspro.region.manage
      block: true
    # --- BellTrade ---
    - pattern: btrade admin
      permission: belltrade.admin
      block: true
    - pattern: belltrade admin
      permission: belltrade.admin
      block: true
    - pattern: btrade reload
      permission: belltrade.admin
      block: true
  # --- BellTrade Pro ---
    - pattern: btradepro
      permission: belltradepro.admin
      block: true
    - pattern: btpro
      permission: belltradepro.admin
      block: true
    - pattern: belltradepro
      permission: belltradepro.admin
      block: true
    # --- BellGate ---
    - pattern: bellgate
      permission: bellgate.admin
      block: true
    # --- ServerGuard ---
    - pattern: sg
      permission: serverguard.admin
      block: true
    - pattern: sghistory
      permission: serverguard.admin
      block: true
    - pattern: sgsearch
      permission: serverguard.admin
      block: true
    # --- SkinStudio ---
    - pattern: skinstudio admin
      permission: skinstudio.admin
      block: true
    - pattern: skintoken
      permission: skinstudio.admin
      block: true

# Monitorowanie skrzyń
containers:
  enabled: true
  # Loguj tylko faktyczne zmiany zawartości (wyjął/włożył)
  # false = loguj też samo otwarcie skrzyni
  changes-only: true
  monitored-types:
    - CHEST
    - TRAPPED_CHEST
    - BARREL
    - ENDER_CHEST
    - SHULKER_BOX
    - HOPPER
    - DROPPER
    - DISPENSER

# Monitorowanie bloków
blocks:
  log-break: true
  log-place: true
  # UWAGA: log-all-blocks: true przy 50 graczach kopiących = ogromna baza
  log-all-blocks: false
  always-log:
    - CHEST
    - TRAPPED_CHEST
    - BARREL
    - ENDER_CHEST
    - SHULKER_BOX
    - SPAWNER
    - BEACON
    - CONDUIT
    - ENCHANTING_TABLE
    - ANVIL
    - JUKEBOX
  # Loguj WSZYSTKIE bloki w promieniu X od najbliższego claima (BellLands).
  # Właściciel tego claima jest pomijany; trusted i obcy — zapisywani.
  # Działa tylko gdy BellLands jest załadowany. Wilderness daleko od claimów = brak logu.
  near-claim:
    enabled: true
    radius: 128
    skip-owner: true

# Encje: zwierzęta, ramki, stojaki (tylko gdy gracz jako sprawca)
entities:
  enabled: true
  monitored-types:
    - COW
    - PIG
    - SHEEP
    - CHICKEN
    - HORSE
    - DONKEY
    - MULE
    - LLAMA
    - RABBIT
    - MOOSHROOM
    - GOAT
    - ARMOR_STAND
    - ITEM_FRAME
    - GLOW_ITEM_FRAME
    - PAINTING
  near-claim:
    enabled: true
    radius: 128
    skip-owner: true

# Alerty dla adminów
alerts:
  enabled: true
  prefix: "&c[&4SG&c] &e"
  sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
  # Minimalny odstęp między podobnymi alertami (sekundy). 0 = wyłączony.
  cooldown-seconds: 30

# Baza danych
database:
  type: sqlite
  sqlite-file: "serverguard.db"
  retention:
    enabled: true
    days: 30
    interval-hours: 24
    initial-delay-minutes: 10
  mysql:
    host: "localhost"
    port: 3306
    database: "serverguard"
    username: "root"
    password: "haslo"
