# ServerGuard v2 - Konfiguracja
# Zoptymalizowana pod 50+ graczy

# Język panelu GUI: pl | en
language: pl

# Gracze na liście obserwacji (priorytet w GUI, oznaczenie ★)
watch:
  players: []

# Jak często opróżniać bufor i zapisywać do bazy (sekundy)
# Mniejsza wartość = szybsze logi, większe obciążenie. Zalecane: 3-10
flush-interval: 5

# Maksymalny rozmiar bufora (zdarzenia). Przy przekroczeniu - natychmiastowy flush.
# Zabezpieczenie przed zapełnieniem RAM przy spike'ach aktywności.
max-buffer-size: 500

# Monitorowanie komend
commands:
  log-all: true
  # Dodatkowe alerty gdy ktoś Z uprawnieniem użyje wrażliwej komendy (opcjonalny audit trail)
  alert-list:
    - "/op"
    - "/deop"
    - "/ban"
    - "/pardon"
    - "/stop"
    - "/restart"
    - "/gamemode"
    - "/gm"
    - "/give"
    - "/summon"
    - "/setblock"
    - "/fill"
    - "/execute"

# Teleporty — domyślnie tylko admin/plugin (bez ender pearl, chorus, portalów)
teleports:
  enabled: true
  log-causes:
    - COMMAND
    - PLUGIN
    - SPECTATE

# Logi moderacji (gamemode, kick, konsola)
moderation:
  log-gamemode: true
  # Vanilla Paper IGNORUJE minecraft.command.gamemode.creative=false.
  # Włącz egzekucję: wejście w CREATIVE wymaga osobnej permisji z restricted-gamemodes.
  enforce-gamemode-perms: true
  gamemode-deny-message: "&c[ServerGuard] &eNie masz uprawnien do trybu &f{mode}&e."
  # Tryb → wymagana permisja. Brak wpisu = brak dodatkowej blokady (wystarczy /gamemode).
  restricted-gamemodes:
    CREATIVE: minecraft.command.gamemode.creative
  log-kicks: true
  log-console-commands: true
  console-alert-prefixes:
    - "/op"
    - "/deop"
    - "/ban"
    - "/pardon"
    - "/kick"
    - "/gamemode"
    - "/gm"
    - "/give"
    - "/stop"
    - "/restart"

# Audyt komend admina — wykrywa próby użycia bez wymaganego uprawnienia (vanilla + Bell)
admin-audit:
  enabled: true
  notify-permission: serverguard.notify
  bypass-permission: serverguard.audit.bypass
  block-unauthorized: true
  player-message: "&c[ServerGuard] &eTa komenda jest zablokowana."
  rules:
    # --- Vanilla Minecraft ---
    - pattern: gamemode
      permission: minecraft.command.gamemode
      block: true
    - pattern: gm
      permission: minecraft.command.gamemode
      block: true
    - pattern: op
      permission: minecraft.command.op
      block: true
    - pattern: deop
      permission: minecraft.command.deop
      block: true
    - pattern: ban
      permission: minecraft.command.ban
      block: true
    - pattern: pardon
      permission: minecraft.command.pardon
      block: true
    - pattern: kick
      permission: minecraft.command.kick
      block: true
    - pattern: give
      permission: minecraft.command.give
      block: true
    - pattern: stop
      permission: minecraft.command.stop
      block: true
    - pattern: restart
      permission: bukkit.command.restart
      block: true
    - pattern: summon
      permission: minecraft.command.summon
      block: true
    - pattern: setblock
      permission: minecraft.command.setblock
      block: true
    - pattern: fill
      permission: minecraft.command.fill
      block: true
    - pattern: execute
      permission: minecraft.command.execute
      block: true
    - pattern: tp
      permission: minecraft.command.teleport
      block: false
    - pattern: teleport
      permission: minecraft.command.teleport
      block: false
    - pattern: kill
      permission: minecraft.command.kill
      block: true
    - pattern: clear
      permission: minecraft.command.clear
      block: true
    - pattern: effect
      permission: minecraft.command.effect
      block: true
    - pattern: enchant
      permission: minecraft.command.enchant
      block: true
  # WorldEdit (jeśli zainstalowany)
    - pattern: "//set"
      permission: worldedit.region.set
      block: true
    - pattern: "//fill"
      permission: worldedit.region.fill
      block: true
    - pattern: "//replace"
      permission: worldedit.region.replace
      block: true
    - pattern: "//copy"
      permission: worldedit.clipboard.copy
      block: true
    - pattern: "//paste"
      permission: worldedit.clipboard.paste
      block: true
    # --- BellChat ---
    - pattern: mute
      permission: bellchat.mute
      block: true
    - pattern: unmute
      permission: bellchat.mute
      block: true
    - pattern: clearchat
      permission: bellchat.clearchat
      block: true
    - pattern: cc
      permission: bellchat.clearchat
      block: true
    - pattern: chatlock
      permission: bellchat.chatlock
      block: true
    - pattern: cl
      permission: bellchat.chatlock
      block: true
    - pattern: msgspy
      permission: bellchat.spy
      block: true
    - pattern: spy
      permission: bellchat.spy
      block: true
    - pattern: bch mute
      permission: bellchat.mute
      block: true
    - pattern: bellchat mute
      permission: bellchat.mute
      block: true
    - pattern: bch unmute
      permission: bellchat.mute
      block: true
    - pattern: bellchat unmute
      permission: bellchat.mute
      block: true
    - pattern: bch clearchat
      permission: bellchat.clearchat
      block: true
    - pattern: bch chatlock
      permission: bellchat.chatlock
      block: true
    - pattern: bch spy
      permission: bellchat.spy
      block: true
    - pattern: bch gui
      permission: bellchat.admin
      block: true
    - pattern: bch reload
      permission: bellchat.admin
      block: true
    - pattern: bch lang
      permission: bellchat.admin
      block: true
    - pattern: bellchat gui
      permission: bellchat.admin
      block: true
    - pattern: bellchat reload
      permission: bellchat.admin
      block: true
    # --- BellMarket ---
    - pattern: bc give
      permission: bellmarket.coins.give
      block: true
    - pattern: bc take
      permission: bellmarket.coins.take
      block: true
    - pattern: bc set
      permission: bellmarket.coins.set
      block: true
    - pattern: bellcoins give
      permission: bellmarket.coins.give
      block: true
    - pattern: bellcoins take
      permission: bellmarket.coins.take
      block: true
    - pattern: bellcoins set
      permission: bellmarket.coins.set
      block: true
    - pattern: coins give
      permission: bellmarket.coins.give
      block: true
    - pattern: vt give
      permission: bellmarket.viptoken.admin
      block: true
    - pattern: vt take
      permission: bellmarket.viptoken.admin
      block: true
    - pattern: vt set
      permission: bellmarket.viptoken.admin
      block: true
    - pattern: viptokens give
      permission: bellmarket.viptoken.admin
      block: true
    - pattern: bm admin
      permission: bellmarket.admin
      block: true
    - pattern: bm reload
      permission: bellmarket.admin
      block: true
    - pattern: bm prices
      permission: bellmarket.admin
      block: true
    - pattern: bm generate
      permission: bellmarket.admin
      block: true
    - pattern: bm lang
      permission: bellmarket.admin
      block: true
    - pattern: bellmarket admin
      permission: bellmarket.admin
      block: true
    - pattern: bellmarket reload
